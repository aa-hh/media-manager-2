<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planet playground</title>
<style>
  :root { color-scheme: dark; --bg: #07080b; --panel: #11131a; --line: #232733; --text: #d9dce4; --dim: #8a90a0; --gold: #ffb338; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }
  main { display: grid; place-items: center; padding: 16px; min-width: 0; min-height: 0; }
  canvas { width: min(100%, calc(100vh - 32px)); aspect-ratio: 1; image-rendering: pixelated; border-radius: 12px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 0 16px 24px; }
  .bar { position: sticky; top: 0; background: var(--panel); padding: 14px 0 10px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); z-index: 1; }
  button { background: #1b1f2b; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); margin: 22px 0 6px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 5px 0; color: var(--dim); }
  label output { color: var(--text); font-variant-numeric: tabular-nums; }
  label input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
  label input[type=color] { width: 44px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; justify-self: end; }
  .none { padding: 40px; text-align: center; color: var(--dim); }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } canvas { width: 100%; } }
</style></head>
<body><main><canvas id="c"></canvas></main><aside id="panel"></aside>
<script type="module">
const SPEC = [["Planet",[["px","Pixels across the frame",80,480,10,390],["disc","Planet size (share of the frame)",0.25,0.46,0.01,0.33],["az","Light direction (degrees)",0,360,1,89],["el","Light height (degrees)",0,60,1,19.47]]],["Clouds",[["cloudSpeed","Cloud speed (1 = sign-in page)",0,6,0.1,1],["warp","Folding of the bands",0,3,0.05,2.3],["vortex","Storm spin",0,3,0.05,0.75],["contrast","Light against dark",0,1.5,0.05,1.2],["flow","Wind along the bands",0,3,0.05,1],["jets","Number of bands",2,10,1,4]]],["Storm (the big dark hole)",[["stormLon","Side-to-side swing (radians)",0,3,0.05,0],["stormLat","Up-and-down swing (radians)",0,0.4,0.01,0.05],["twist","Core twist",0,2,0.05,0.55]]],["Colours",[["tintStrength","Tint strength",0,1,0.05,0.65],["tintScale","Tint wave size (higher = smaller waves)",0.3,4,0.05,0.65],["tintSteps","Flat steps of colour (0 = smooth)",0,12,1,0],["tintA","Tint A","#9665bd"],["tintB","Tint B","#dca8a8"]]],["Halo",[["haloEdge","Outer colour","#1495e6"],["haloHot","Centre colour","#f4ecc3"],["haloGlow","Glow colour","#9ab4de"],["thick","Thickness (share of radius)",0.005,0.1,0.005,0.03],["glowWidth","Glow width",0.03,0.4,0.01,0.1],["bright","Brightness",0,4,0.1,1],["glowBright","Glow brightness",0,2,0.05,0.25],["tail","Extra tail on each side (degrees)",0,90,1,18]]],["Orbit",[["tilt","Tilt from edge-on (degrees)",3,70,1,20],["roll","Roll (degrees, left side down)",-45,45,1,22],["rho","Distance (planet radii)",1,1.5,0.01,1.32],["orbits","Halo turns per loop",0.5,8,0.5,5],["loop","Seconds per loop",4,60,1,27]]]];
const P = {}; for (const [, items] of SPEC) for (const it of items) P[it[0]] = it.length === 3 ? it[2] : it[5];
const DEFAULTS = { ...P };
const R = new URLSearchParams(location.search); // ?render=1&frames=N: render.mjs drives the page frame by frame instead of a person
if (R.get('render')) Object.assign(P, await (await fetch('/settings.json')).json());
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const rad = d => d * Math.PI / 180;
let SIZE = P.px, T = 0, paused = false;

// ---- controls ----
const panel = document.getElementById('panel');
const inputs = {};
panel.insertAdjacentHTML('beforeend', '<div class="bar"><button id="pause">Pause</button><button id="reset">Reset</button><button id="copy">Copy settings</button></div>');
for (const [group, items] of SPEC) {
  panel.insertAdjacentHTML('beforeend', '<h2>' + group + '</h2>');
  for (const it of items) {
    const lab = document.createElement('label'), isColor = it.length === 3;
    lab.innerHTML = '<span>' + it[1] + '</span><output></output><input type="' + (isColor ? 'color' : 'range') + '">';
    const inp = lab.querySelector('input'), out = lab.querySelector('output');
    if (!isColor) { inp.min = it[2]; inp.max = it[3]; inp.step = it[4]; } else out.remove();
    const show = () => { inp.value = P[it[0]]; if (!isColor) out.textContent = P[it[0]]; };
    inp.addEventListener('input', () => { P[it[0]] = isColor ? inp.value : +inp.value; show(); if (it[0] === 'px') resizeCanvas(); });
    inputs[it[0]] = show; show(); panel.appendChild(lab);
  }
}
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play' : 'Pause'; };
document.getElementById('reset').onclick = () => { Object.assign(P, DEFAULTS); for (const k in inputs) inputs[k](); resizeCanvas(); };
const box = document.createElement('textarea');
box.readOnly = true; box.rows = 12; box.hidden = true; box.style.cssText = 'width:100%;margin-top:16px;background:#0b0d12;color:#d9dce4;border:1px solid #232733;border-radius:8px;font:12px/1.4 ui-monospace,monospace;padding:8px';
panel.appendChild(box);
document.getElementById('copy').onclick = async e => {
  box.value = JSON.stringify(P, null, 2); box.hidden = false; box.focus(); box.select();
  let ok = false;
  try { await navigator.clipboard.writeText(box.value); ok = true; } catch { try { ok = document.execCommand('copy'); } catch {} }
  // browsers can refuse clipboard writes from a page opened as a file; the box is then already selected for Cmd+C
  e.target.textContent = ok ? 'Copied' : 'Press Cmd+C'; box.scrollIntoView({ block: 'nearest' });
  setTimeout(() => e.target.textContent = 'Copy settings', 2500);
};

// ---- the planet: its own code, fed a fake clock so that every real frame is one planet frame ----
// The sign-in planet: a WebGL 2 fragment shader ported from design/discovery/sign-in-generative/2d-jupiter-fluid.html.

                                                   
                                               

const V = {
  jets: 4,        // alternating east/west jets from pole to pole (also the number of bands)
  flow: 1.0,      // jet speed multiplier
  warp: 1.0,      // how hard the noise folds and swirls the bands
  vortex: 1.0,    // spin strength of the eddy
  contrast: 0.8,  // light zones against dark belts
  spin: 90,       // seconds per turn of the globe
  grain: 0.05,    // per-pixel film grain
};
const RES = 0.5;      // canvas pixels per CSS pixel, whatever the devicePixelRatio; CSS scales it up
const START = 40;     // cloud clock starts part-way in so the first cycle already has shear
// slate and bone, one cold accent in the air
const STOPS = ['#0b0d13', '#1c2230', '#3a4253', '#6a7079', '#a7a59c', '#e2ddcf'];
const ACCENT = '#93c4d4', LIME = '#c6f135';
// the light: azimuth (0 = right, 90 = up) and elevation toward the viewer. Elevation asin(1/3) leaves a third of the disc in shadow.
const EL = 19.47;
const TARGET                                             = {
  idle:     { az: 30,  zoom: 1,    order: 0, green: 0 },
  checking: { az: 165, zoom: 1.06, order: 0, green: 0 }, // lit side swings round to face the sign-in block
  success:  { az: 165, zoom: 1.06, order: 1, green: 1 },
};
const DUR                                             = {
  idle:     { az: 0.7, zoom: 0.7, order: 0.7, green: 0.7 },
  checking: { az: 4,   zoom: 4,   order: 0.6, green: 0.6 },
  success:  { az: 1.7, zoom: 1.7, order: 1.7, green: 1.7 },
};
const DELAY                                 = { green: 0.5 }; // the green hairline starts once the bands are mostly straight
const PARAMS          = ['az', 'zoom', 'order', 'green'];

function mulberry32(a        ) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = (h        ) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const ease = (x        ) => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// ---- WebGL 2: all per-pixel work runs in this fragment shader ----
const VS = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
precision highp sampler3D;
uniform sampler3D uNoise;   // tiling smooth value noise, 16 features per unit
uniform vec2 uRes;
uniform vec3 uGeo;          // centre x, centre y (from top), radius, canvas pixels
uniform float uTc, uRot, uFrame;
uniform float uJets, uFlow, uWarp, uVortex, uContrast, uGrain;
uniform vec3 uL; uniform vec2 uHalo; uniform vec3 uTint; uniform float uWave, uTail, uStormLat; uniform vec4 uOrbit, uHaloShape; uniform vec3 uHE, uHH, uHG, uTA, uTB;            // light direction: x right, y up, z toward the viewer
uniform float uZoom, uOrder, uGreen, uTwist, uEddyLon;
uniform vec3 uPal[6];
uniform vec3 uAcc;
out vec4 o;
const float PI = 3.14159265, TAU = 6.2831853, HALF = 13.;
const vec3 LIME = vec3(${hex(LIME).map(x => x.toFixed(4))});
#define ELAT (-0.32 + uStormLat * sin(uWave + 1.))
const float EA = 0.42, EB = 0.22; // the eddy: latitude, half-width, half-height (radians)

float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float n3(vec3 p) { return texture(uNoise, p).r * 2. - 1.; }
float fbm2(vec3 p) { return .62 * n3(p) + .31 * n3(p * 2.03 + .17); }
float fbm3(vec3 p) { return .55 * n3(p) + .28 * n3(p * 2.03 + .17) + .14 * n3(p * 4.11 + .41); }
vec3 cyl(float lon, float lat, float seed) { return vec3(3. * cos(lon), 3. * sin(lon), 5. * lat + seed) / 16.; }
float bandF(float la) { return cos(uJets * la + .6 * cos(2.3 * la - .57)); }

// one advection phase: tau seconds of jet shear on noise seeded by cycle n
float cloud(float lat, float lon, float tau, float n, float act, out float gE) {
  float chaos = 1. - uOrder;
  // the eddy: rotate the local ellipse frame by an angle that grows toward the core; unwinds as order rises
  float dx = mod(lon - uEddyLon + PI, TAU) - PI, cl = max(.05, cos(lat));
  vec2 e = vec2(dx * cl / EA, (lat - ELAT) / EB);
  gE = exp(-dot(e, e));
  float th = uVortex * gE * (1.6 + .2 * tau + uTwist * smoothstep(.45, .9, gE)) * chaos;
  e = mat2(cos(th), sin(th), -sin(th), cos(th)) * e;
  lon = uEddyLon + e.x * EA / cl; lat = ELAT + e.y * EB;
  // jets: alternating zonal winds shear the noise; they lock together (zero shear) as order rises
  float u = .03 * uFlow * sin(uJets * lat + .5 * sin(2.3 * lat)) * (.6 + .4 * cl) * (.35 + .65 * act);
  lon -= u * tau * (1. - gE) * chaos;
  float sd = 0.;
  vec3 p = cyl(lon, lat, sd);
  float w = uWarp * chaos;
  float qx = fbm2(p), qy = fbm2(p + vec3(.33, 0., .08));
  float nn = fbm3(cyl(lon + w * qx * .25, lat + w * qy * .09, sd * 1.15 + .19));
  float latW = lat + w * .06 * (qx + nn);
  float brk = mix(clamp(.35 + 2. * qx, 0., 1.), 1., uOrder);  // bands break off along longitude
  float turb = (.25 + .75 * act) * chaos;
  return .5 + .55 * uContrast * bandF(latW) * mix(.3 + .7 * act, 1., .4 * uOrder) * brk + .3 * nn * turb + .08 * qy * chaos;
}

vec3 pal(float v) {
  v = clamp(v, 0., 1.) * 5.;
  float i = min(floor(v), 4.), f = smoothstep(0., 1., v - i);
  vec3 a = uPal[0], b = uPal[1];
  if (i > 3.5) { a = uPal[4]; b = uPal[5]; } else if (i > 2.5) { a = uPal[3]; b = uPal[4]; }
  else if (i > 1.5) { a = uPal[2]; b = uPal[3]; } else if (i > .5) { a = uPal[1]; b = uPal[2]; }
  return mix(a, b, f);
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  float rad = uGeo.z * uZoom;
  vec2 q = (fc - vec2(uGeo.x, uRes.y - uGeo.y)) / rad;
  float r = length(q);
  float hs = hash(fc);
  float dith = (hash(fc + fract(uFrame * .6180339) * 241.) - .5);
  vec3 col = vec3(7., 8., 11.) / 255. + (hs > .9992 ? (30. + 110. * hash(fc.yx)) / 255. * vec3(.9, .95, 1.) : vec3(0.));
  vec2 l2 = normalize(uL.xy + 1e-5);
  if (r >= 1.) {
    // thin halo just outside the disc, brighter on the lit side
    float f = max(0., dot(q / r, l2)) * .85 + .15;
    col += uAcc * exp(-(r - 1.) * 30.) * f * .27;
    vec2 qr = vec2(uOrbit.z * q.x + uOrbit.w * q.y, -uOrbit.w * q.x + uOrbit.z * q.y);
    vec2 ou = qr / vec2(uOrbit.x, uOrbit.x * uOrbit.y); float ol = max(length(ou), 1e-4);
    vec2 og = vec2(qr.x / (uOrbit.x * uOrbit.x), qr.y / pow(uOrbit.x * uOrbit.y, 2.)) / ol; vec2 ph = ou / ol;
    float hr = max(0., (dot(ph, uHalo) + uTail) / (1. + uTail)) ; float dd = (ol - 1.) / max(length(og), 1e-4);
    col += (mix(uHE, uHH, hr) * exp(-pow(dd / uHaloShape.x, 2.)) * uHaloShape.z + uHG * exp(-pow(dd / uHaloShape.y, 2.)) * uHaloShape.w) * hr; o = vec4(col + dith / 255., 1.); return;
  }
  float nz = sqrt(1. - r * r);
  vec3 n = vec3(q, nz);
  // body frame: a little roll and pitch, then latitude/longitude
  const float cr = .98007, sr = .19867, cp = .98723, sp = .15932;
  float xa = q.x * cr + q.y * sr, ya = -q.x * sr + q.y * cr, yb = ya * cp - nz * sp, zb = ya * sp + nz * cp;
  float lat = asin(clamp(yb, -1., 1.)), lon = atan(xa, zb) + uRot;
  float act = smoothstep(-.3, .3, .55 * sin(lat * 2.6 + .9) + .45 * sin(lat * 4.1 - .4) + .1); // 0 = almost calm latitude
  // two advection cycles, offset by half a cycle, cross-fade so the shear never runs away
  float n1 = floor(uTc / HALF), tau1 = uTc - n1 * HALF, w1 = tau1 / HALF, g0, g1;
  float v = (1. - w1) * cloud(lat, lon, tau1 + HALF, n1 - 1., act, g0) + w1 * cloud(lat, lon, tau1, n1, act, g1);
  // ordered state: clean evenly spaced parallels, lined up with the bands
  v += uOrder * (.17 * pow(.5 + .5 * cos(uJets * 3. * lat), 40.) - .05);
  // the eddy: a sunken dark core with a faint pale collar; a smooth oval remains once ordered
  float core = smoothstep(.3, .85, g0), collar = smoothstep(.07, .22, g0) * (1. - smoothstep(.22, .42, g0));
  v = mix(v, .07 + .3 * (v - .5), core * (1. - .6 * uOrder)) + .12 * collar * (1. - uOrder);
  v = mix(v, .32 + .3 * (v - .5), smoothstep(.95, 1.4, abs(lat))); // polar hoods
  // shading: a third of the disc in night; the day/night edge and the limb sharpen as order rises
  float d = dot(n, uL);
  float aa = 1.2 / rad;
  float edge = smoothstep(1., 1. - mix(.015, aa, uOrder), r);
  float sh = (.012 + 1.04 * smoothstep(mix(-.1, -.02, uOrder), mix(.72, .5, uOrder), d)) * edge * (.5 + .5 * pow(nz, .45));
  float haze = pow(1. - nz, 2.5) * .37 * max(0., d + .15);
  float rim = smoothstep(mix(.95, .985, uOrder), .997, r) * .59 * (.22 + .9 * smoothstep(-.35, .45, d)) * edge;
  float tw = .5 + .5 * sin(uTint.y * (3. * lat + 2. * lon) - uWave); if (uTint.z > .5) tw = (floor(tw * uTint.z) + .5) / uTint.z; col = pal(v) * mix(vec3(1.), mix(uTA * 1.4, uTB * 1.4, tw), uTint.x) * sh + uAcc * (haze + rim);
  col += (hash(fc * 1.37 + fract(uFrame * .7548776) * 173.) - .5) * uGrain;
  // success: the only green is a faint edge on the lit limb
  float limbG = smoothstep(1. - 2. * aa, 1. - aa * .3, r) * max(0., dot(q / r, l2)) * .3;
  col = mix(col, LIME, uGreen * limbG);
  vec2 qr = vec2(uOrbit.z * q.x + uOrbit.w * q.y, -uOrbit.w * q.x + uOrbit.z * q.y);
    vec2 ou = qr / vec2(uOrbit.x, uOrbit.x * uOrbit.y); float ol = max(length(ou), 1e-4);
    vec2 og = vec2(qr.x / (uOrbit.x * uOrbit.x), qr.y / pow(uOrbit.x * uOrbit.y, 2.)) / ol; vec2 ph = ou / ol;
    float hr = max(0., (dot(ph, uHalo) + uTail) / (1. + uTail)) * step(ph.y, 0.); float dd = (ol - 1.) / max(length(og), 1e-4);
    col += (mix(uHE, uHH, hr) * exp(-pow(dd / uHaloShape.x, 2.)) * uHaloShape.z + uHG * exp(-pow(dd / uHaloShape.y, 2.)) * uHaloShape.w) * hr;
  o = vec4(col + dith / 255., 1.);
}`;

export function createPlanet(canvas                   , reducedMotion         )                                                                      {
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });
  if (!gl) {
    console.warn('WebGL 2 unavailable: the planet is not drawn'); // razor: no Canvas 2D fallback
    return undefined;
  }
  const U                                              = {};
  function sh(type        , src        ) { const s = gl .createShader(type) ; gl .shaderSource(s, src); gl .compileShader(s); if (!gl .getShaderParameter(s, gl .COMPILE_STATUS)) throw new Error(gl .getShaderInfoLog(s) ?? 'shader compile failed'); return s; }
  try {
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr) ?? 'program link failed');
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    for (let i = 0, nu = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS)          ; i < nu; i++) { const nm = gl.getActiveUniform(pr, i) .name.replace('[0]', ''); U[nm] = gl.getUniformLocation(pr, nm); }
  } catch (error) {
    console.warn('The sign-in planet shader failed to build: the planet is not drawn', error);
    return undefined;
  }
  // noise volume: 64^3 texels, smooth (quintic) interpolation of a 16^3 random lattice, wraps on every axis
  const S = 64, L = 16, rnd = mulberry32(11), lat = new Float32Array(L * L * L).map(() => rnd()), vol = new Uint8Array(S * S * S);
  const f = (x        ) => x * x * x * (x * (x * 6 - 15) + 10);
  for (let z = 0, k = 0; z < S; z++) for (let y = 0; y < S; y++) for (let x = 0; x < S; x++, k++) {
    const gx = x * L / S, gy = y * L / S, gz = z * L / S, x0 = gx | 0, y0 = gy | 0, z0 = gz | 0;
    const u = f(gx - x0), v = f(gy - y0), w = f(gz - z0), x1 = (x0 + 1) % L, y1 = (y0 + 1) % L, z1 = (z0 + 1) % L;
    const at = (a        , b        , c        ) => lat[(c * L + b) * L + a];
    const m = (a        , b        , t        ) => a + (b - a) * t;
    vol[k] = 255 * m(m(m(at(x0, y0, z0), at(x1, y0, z0), u), m(at(x0, y1, z0), at(x1, y1, z0), u), v),
                     m(m(at(x0, y0, z1), at(x1, y0, z1), u), m(at(x0, y1, z1), at(x1, y1, z1), u), v), w);
  }
  gl.bindTexture(gl.TEXTURE_3D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, S, S, S, 0, gl.RED, gl.UNSIGNED_BYTE, vol);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_3D, p, gl.LINEAR);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, p, gl.REPEAT);
  gl.uniform1i(U.uNoise, 0);

  gl.uniform3fv(U.uPal, STOPS.flatMap(hex));
  gl.uniform3fv(U.uAcc, hex(ACCENT));
  gl.uniform1f(U.uJets, V.jets); gl.uniform1f(U.uFlow, V.flow); gl.uniform1f(U.uWarp, V.warp);
  gl.uniform1f(U.uVortex, V.vortex); gl.uniform1f(U.uContrast, V.contrast); gl.uniform1f(U.uGrain, V.grain);

  let narrow = false;
  function resize() {
    const W = Math.max(1, Math.round(innerWidth * RES)), H = Math.max(1, Math.round(innerHeight * RES));
    canvas.width = W; canvas.height = H;
    narrow = innerWidth < 640;
    gl .viewport(0, 0, W, H);
    gl .uniform2f(U.uRes, W, H);
    gl .uniform3f(U.uGeo, narrow ? W * 0.62 : W * 0.76, narrow ? H * 0.3 : H * 0.5, narrow ? Math.min(W, H) * 0.62 : Math.min(H * 0.66, W * 0.38));
  }

  // ---- states: each parameter tweens from wherever it is to the new state's target ----
  const tw = {}                                                                        ;
  for (const k of PARAMS) tw[k] = { from: TARGET.idle[k], to: TARGET.idle[k], t0: 0, dur: 1 };
  const pv = (k       , t        ) => { const p = tw[k]; return p.from + (p.to - p.from) * ease((t - p.t0) / p.dur); };
  // on a phone the sign-in block sits below the planet, so the light swings down-left instead of left
  const target = (s             , k       ) => k === 'az' && s !== 'idle' && narrow ? 235 : TARGET[s][k];
  let state              = 'idle', tCheck                = null, lastChange = -99, curT = 0;

  // ---- frame: the CPU only sets a few uniforms ----
  let frameNo = 0;
  function frame(t        ) {
    curT = t;
    const tc = START + t;
    // the eddy quickens while waiting: extra twist accumulates from the moment checking starts
    const twist = tCheck === null ? 0 : 0.12 * Math.min(Math.max(0, t - tCheck), 40);
    const az = pv('az', t) * Math.PI / 180, el = EL * Math.PI / 180;
    gl .uniform3f(U.uL, Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el));
    gl .uniform1f(U.uZoom, pv('zoom', t)); gl .uniform1f(U.uOrder, pv('order', t)); gl .uniform1f(U.uGreen, pv('green', t));
    gl .uniform1f(U.uTwist, twist); gl .uniform1f(U.uTc, tc);
    gl .uniform1f(U.uRot, ((tc / V.spin) % 1) * 2 * Math.PI);
    gl .uniform1f(U.uEddyLon, 3.3 - 0.002 * tc * V.flow);
    gl .uniform1f(U.uFrame, frameNo++);
    gl .drawArrays(gl .TRIANGLES, 0, 3);
  }

  let raf = 0, T0real = 0, tBase = 0, lastDraw = -1e9;
  const STEP = 1000 / 24;
  function loop(now        ) {
    raf = requestAnimationFrame(loop);
    const t = tBase + (now - T0real) / 1000;
    // razor: 24 fps fixed step while idle or checking (a 90 s turn and slow drift); full rate through the success transition and 1 s after any state change
    const fast = t - lastChange < (state === 'success' ? 1.7 + (DELAY.green ?? 0) + 1 : 1);
    if (!fast) { if (now - lastDraw < STEP) return; lastDraw = now - Math.min((now - lastDraw) % STEP, STEP / 2); }
    else lastDraw = now;

  }
  function start() { if (!raf) { T0real = performance.now(); tBase = curT; raf = requestAnimationFrame(loop); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  const onVisibility = () => { if (reducedMotion) return; if (document.hidden) stop(); else start(); };
  const onResize = () => { resize(); if (reducedMotion) frame(curT); };
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('resize', onResize);

  // ---- boot ----
  resize();
  if (reducedMotion) frame(0);
  else start();

  return {
    setState(s) {
      if (s === state) return;
      const t = curT, instant = reducedMotion;
      for (const k of PARAMS) {
        const p = tw[k], dl = s === 'success' ? DELAY[k] ?? 0 : 0;
        p.from = instant ? target(s, k) : pv(k, t); p.to = target(s, k); p.t0 = t + (instant ? 0 : dl); p.dur = instant ? 1e-6 : DUR[s][k];
      }
      if (s === 'checking' && tCheck === null) tCheck = t;
      state = s; lastChange = t;
      if (reducedMotion) frame(curT);
    },
    destroy() {
      stop();
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('resize', onResize);
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    },
  };
}


const realRaf = window.requestAnimationFrame.bind(window);
let now = 0, pending = null;
performance.now = () => now;
window.requestAnimationFrame = cb => { pending = cb; return 1; };
const setWindow = () => { for (const k of ['innerWidth', 'innerHeight']) Object.defineProperty(window, k, { value: SIZE * 2, configurable: true }); };
setWindow();

const proto = WebGL2RenderingContext.prototype, names = new Map(), held = {};
const getLoc = proto.getUniformLocation, uniform1f = proto.uniform1f, uniform3f = proto.uniform3f;
proto.getUniformLocation = function (p, n) { const l = getLoc.call(this, p, n); if (l) names.set(l, n); return l; };
const phase = () => 2 * Math.PI * T / P.loop;
proto.uniform1f = function (l, v) {
  const n = names.get(l);
  if (n === 'uTc') v = (held.uTc ??= v) + P.cloudSpeed * T;
  else if (n === 'uEddyLon') v = (held.uEddyLon ??= v) + P.stormLon * Math.sin(phase());
  else if (n === 'uTwist') v = P.twist * Math.sin(phase());
  else if (n === 'uRot') v = (held.uEddyLon ?? 3.3) - 0.5; // the globe holds still, the storm a little right of centre
  else if (n === 'uFrame' || n === 'uGrain') v = 0;
  uniform1f.call(this, l, v);
};
proto.uniform3f = function (l, x, y, z) {
  const n = names.get(l);
  if (n === 'uGeo') { x = SIZE / 2; y = SIZE / 2; z = SIZE * P.disc; }
  else if (n === 'uL') { const a = rad(P.az), e = rad(P.el); x = Math.cos(e) * Math.cos(a); y = Math.cos(e) * Math.sin(a); z = Math.sin(e); }
  uniform3f.call(this, l, x, y, z);
};

const canvas = document.getElementById('c');
const planet = createPlanet(canvas, false);
if (!planet) { document.querySelector('main').innerHTML = '<p class="none">WebGL 2 is not available in this browser, so the planet cannot be drawn.</p>'; throw new Error('no WebGL 2'); }
const gl = canvas.getContext('webgl2');
const L = {}; for (const [l, n] of names) L[n] = l;
for (const n of ['uWarp', 'uVortex', 'uContrast', 'uFlow', 'uJets', 'uHalo', 'uWave', 'uOrbit', 'uHaloShape', 'uTail', 'uHE', 'uHH', 'uHG', 'uTA', 'uTB', 'uTint', 'uStormLat'])
  if (!L[n]) throw new Error('shader input ' + n + ' not found: signInPlanet.ts changed');

function resizeCanvas() { SIZE = P.px; setWindow(); window.dispatchEvent(new Event('resize')); }

function applyInputs() {
  const a = P.orbits * phase() - Math.PI / 2, roll = rad(P.roll), sinTail = Math.sin(rad(P.tail));
  gl.uniform1f(L.uWarp, P.warp); gl.uniform1f(L.uVortex, P.vortex); gl.uniform1f(L.uContrast, P.contrast); gl.uniform1f(L.uFlow, P.flow); gl.uniform1f(L.uJets, P.jets);
  gl.uniform2f(L.uHalo, Math.cos(a), Math.sin(a)); gl.uniform1f(L.uWave, phase());
  gl.uniform4f(L.uOrbit, P.rho, Math.sin(rad(P.tilt)), Math.cos(roll), Math.sin(roll));
  gl.uniform4f(L.uHaloShape, P.thick, P.glowWidth, P.bright, P.glowBright); gl.uniform1f(L.uTail, sinTail);
  gl.uniform3fv(L.uHE, rgb(P.haloEdge)); gl.uniform3fv(L.uHH, rgb(P.haloHot)); gl.uniform3fv(L.uHG, rgb(P.haloGlow));
  gl.uniform3fv(L.uTA, rgb(P.tintA)); gl.uniform3fv(L.uTB, rgb(P.tintB)); gl.uniform3f(L.uTint, P.tintStrength, P.tintScale, P.tintSteps); gl.uniform1f(L.uStormLat, P.stormLat);
}

let last = 0;
function tick(ts) {
  realRaf(tick);
  if (!paused && last) T += Math.min((ts - last) / 1000, 0.1);
  last = ts;
  applyInputs();
  now += 100; const cb = pending; pending = null; cb(now); // 100 ms steps keep the planet's own 24-frames-a-second limiter from skipping frames
}
if (R.get('render')) {
  const post = (path, body) => fetch(path, { method: 'POST', body });
  try {
    // the cloud motion repeats every 13 s of cloud time, so a loop closes only when it spans a whole number of them
    P.cloudSpeed = Math.max(1, Math.round(P.cloudSpeed * P.loop / 13)) * 13 / P.loop;
    const frames = +R.get('frames');
    for (let i = -1; i < frames; i++) { // frame -1 is a throwaway: the planet reports its first-frame clock and storm position while drawing it
      T = P.loop * Math.max(i, 0) / frames; applyInputs();
      now += 100; const cb = pending; pending = null; cb(now);
      if (i >= 0) await post('/frame/' + i, Uint8Array.from(atob(canvas.toDataURL('image/png').split(',')[1]), c => c.charCodeAt(0)));
    }
    await post('/done', '');
  } catch (e) { await post('/error', String(e && e.stack || e)); }
} else realRaf(tick);
</script></body></html>
