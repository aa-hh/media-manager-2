<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · media-manager-2</title>
<style>
  :root { --ground: #07080b; --text: #ece9e1; --text-dim: #9d9e9c; --paper: #ece9e1; --plex: #e5a00d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ground); color: var(--text); overflow: hidden; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  .signin {
    position: absolute; left: max(24px, 8vw); top: 50%; transform: translateY(-50%);
    width: 380px; display: flex; flex-direction: column; gap: 16px;
    text-shadow: 0 0 14px var(--ground), 0 0 4px var(--ground);
  }
  .mark { font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); }
  h1 { font: 600 40px/1.05 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.03em; margin-bottom: 6px; }
  p { color: var(--text-dim); max-width: 34ch; }
  p strong { color: var(--text); font-weight: 500; }
  button.go {
    position: relative; margin-top: 10px; align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 22px 0 18px; border: 0; border-radius: 2px; cursor: pointer;
    background: var(--plex); color: var(--ground); font: 600 15px/1 inherit; font-family: inherit; text-shadow: none;
    transition: background-color .6s ease, color .6s ease, opacity .6s ease;
  }
  button.go:hover:not(:disabled) { filter: brightness(1.06); }
  button.go:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button.go:disabled { cursor: default; }
  button.go svg { width: 14px; height: 14px; fill: currentColor; }
  /* while working: label and chevron hidden (the button keeps its width), a centred spinner in the label colour */
  button.go:disabled { opacity: .78; }
  button.go:disabled > * { visibility: hidden; }
  button.go:disabled::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { button.go:disabled::after { animation: none; } }
  /* sits 12px under the button, outside the flow, so nothing above it moves when it appears */
  #msg { position: absolute; left: 0; top: calc(100% + 12px); white-space: nowrap; font-size: 14px; line-height: 21px; color: #cdb08e; visibility: hidden; }
  body[data-state="error"] #msg { visibility: visible; }
  #panel {
    position: fixed; right: 16px; bottom: 16px; width: 260px; padding: 12px 14px; z-index: 5;
    background: rgba(10, 11, 14, .86); border: 1px solid rgba(236, 233, 225, .14); border-radius: 4px;
    font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-dim);
  }
  #panel.closed .body { display: none; }
  #panel .head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text); }
  #panel label { display: grid; grid-template-columns: 92px 1fr 38px; gap: 6px; align-items: center; margin-top: 7px; }
  #panel input[type=range] { width: 100%; accent-color: #b9bcc0; }
  #panel output { text-align: right; color: var(--text); }
  #panel pre { margin-top: 10px; white-space: pre-wrap; word-break: break-all; color: var(--text-dim); font: inherit; }
  #panel button { margin-top: 8px; font: inherit; background: none; color: var(--text); border: 1px solid rgba(236,233,225,.3); border-radius: 2px; padding: 4px 8px; cursor: pointer; }
  #bench { position: fixed; left: 12px; bottom: 10px; font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-dim); z-index: 5; }
  @media (max-width: 700px) {
    .signin { left: 24px; right: 24px; width: auto; top: auto; bottom: 48px; transform: none; }
    h1 { font-size: 30px; }
    #msg { white-space: normal; }
    #panel { width: 220px; }
  }
</style>
</head>
<body data-state="idle">
<canvas id="c" aria-hidden="true"></canvas>
<main class="signin">
  <div class="mark">Owner sign-in</div>
  <h1>media-manager-2</h1>
  <p><strong>Only the owner's Plex account can open this app.</strong></p>
  <p>Plex is used only to confirm who you are. It never sees your password.</p>
  <button class="go" type="button" aria-label="Log in with Plex">
    <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M 14.03125 0 L 37.09375 36 L 14.03125 72 L 34.90625 72 L 57.96875 36 L 34.90625 0 L 14.03125 0 z"/></svg>
    <span>Log in with Plex</span>
  </button>
  <div id="msg" role="status"></div>
</main>

<aside id="panel" class="closed" aria-label="Tweak panel">
  <div class="head" id="ph"><span>Tweaks</span><span>T</span></div>
  <div class="body">
    <div id="sliders"></div>
    <button type="button" id="copy">Copy values</button>
    <pre id="vals"></pre>
  </div>
</aside>
<div id="bench" hidden></div>

<script>
// ---- Tunable values (the tweak panel edits these live; each one is a shader uniform) ----
const V = {
  jets: 4,        // alternating east/west jets from pole to pole (also the number of bands)
  flow: 1.0,      // jet speed multiplier
  warp: 1.0,      // how hard the noise folds and swirls the bands
  vortex: 1.0,    // spin strength of the eddy
  contrast: 0.8,  // light zones against dark belts
  spin: 90,       // seconds per turn of the globe
  grain: 0.05,    // per-pixel film grain
  hue: 0,         // palette hue rotation, degrees
};
const SLIDERS = [
  ['jets', 2, 13, 1], ['flow', 0, 3, 0.05], ['warp', 0, 2.5, 0.05], ['vortex', 0, 3, 0.05],
  ['contrast', 0, 1.5, 0.05], ['spin', 30, 240, 5], ['grain', 0, 0.2, 0.005], ['hue', -180, 180, 1],
];
const RES = 0.5;      // canvas pixels per CSS pixel, whatever the devicePixelRatio; CSS scales it up
const START = 40;     // cloud clock starts part-way in so the first cycle already has shear
// slate and bone, one cold accent in the air
const STOPS = ['#0b0d13', '#1c2230', '#3a4253', '#6a7079', '#a7a59c', '#e2ddcf'];
const ACCENT = '#93c4d4', LIME = '#c6f135';
// the light: azimuth (0 = right, 90 = up) and elevation toward the viewer. Elevation asin(1/3) leaves a third of the disc in shadow.
const EL = 19.47;
const TARGET = {
  idle:     { az: 30,  zoom: 1,    order: 0, green: 0 },
  checking: { az: 165, zoom: 1.06, order: 0, green: 0 }, // lit side swings round to face the sign-in block
  success:  { az: 165, zoom: 1.06, order: 1, green: 1 },
};
const DUR = {
  idle:     { az: 0.7, zoom: 0.7, order: 0.7, green: 0.7 },
  checking: { az: 4,   zoom: 4,   order: 0.6, green: 0.6 },
  success:  { az: 1.7, zoom: 1.7, order: 1.7, green: 1.7 },
};
const DELAY = { green: 0.5 }; // the green hairline starts once the bands are mostly straight

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);
const BENCH = Q.has('bench'), STILL = Q.has('t') ? parseFloat(Q.get('t')) || 0 : null;
if (Q.has('bare')) for (const el of document.querySelectorAll('.signin, #panel')) el.style.display = 'none'; // planet only, for design stills

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function hueRot(c, deg) {
  const a = deg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a), k = (1 - cs) / 3, q = Math.sqrt(1 / 3) * sn;
  const m0 = cs + k, m1 = k - q, m2 = k + q;
  return [c[0] * m0 + c[1] * m1 + c[2] * m2, c[0] * m2 + c[1] * m0 + c[2] * m1, c[0] * m1 + c[1] * m2 + c[2] * m0].map(x => Math.max(0, Math.min(1, x)));
}

// ---- WebGL 2: all per-pixel work runs in this fragment shader ----
const VS = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
precision highp sampler3D;
uniform sampler3D uNoise;   // tiling smooth value noise, 16 features per unit
uniform vec2 uRes;
uniform vec3 uGeo;          // centre x, centre y (from top), radius, canvas pixels
uniform float uTc, uRot, uFrame;
uniform float uJets, uFlow, uWarp, uVortex, uContrast, uGrain;
uniform vec3 uL;            // light direction: x right, y up, z toward the viewer
uniform float uZoom, uOrder, uGreen, uTwist, uEddyLon;
uniform vec3 uPal[6];
uniform vec3 uAcc;
out vec4 o;
const float PI = 3.14159265, TAU = 6.2831853, HALF = 13.;
const vec3 LIME = vec3(${hex(LIME).map(x => x.toFixed(4))});
const float ELAT = -0.32, EA = 0.42, EB = 0.22; // the eddy: latitude, half-width, half-height (radians)

float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float n3(vec3 p) { return texture(uNoise, p).r * 2. - 1.; }
float fbm2(vec3 p) { return .62 * n3(p) + .31 * n3(p * 2.03 + .17); }
float fbm3(vec3 p) { return .55 * n3(p) + .28 * n3(p * 2.03 + .17) + .14 * n3(p * 4.11 + .41); }
vec3 cyl(float lon, float lat, float seed) { return vec3(3. * cos(lon), 3. * sin(lon), 5. * lat + seed) / 16.; }
float bandF(float la) { return cos(uJets * la + .6 * cos(2.3 * la - .57)); }

// one advection phase: tau seconds of jet shear on noise seeded by cycle n
float cloud(float lat, float lon, float tau, float n, float act, out float gE) {
  float chaos = 1. - uOrder;
  // the eddy: rotate the local ellipse frame by an angle that grows toward the core; unwinds as order rises
  float dx = mod(lon - uEddyLon + PI, TAU) - PI, cl = max(.05, cos(lat));
  vec2 e = vec2(dx * cl / EA, (lat - ELAT) / EB);
  gE = exp(-dot(e, e));
  float th = uVortex * gE * (1.6 + .2 * tau + uTwist) * chaos;
  e = mat2(cos(th), sin(th), -sin(th), cos(th)) * e;
  lon = uEddyLon + e.x * EA / cl; lat = ELAT + e.y * EB;
  // jets: alternating zonal winds shear the noise; they lock together (zero shear) as order rises
  float u = .03 * uFlow * sin(uJets * lat + .5 * sin(2.3 * lat)) * (.6 + .4 * cl) * (.35 + .65 * act);
  lon -= u * tau * (1. - gE) * chaos;
  float sd = n * .4456;
  vec3 p = cyl(lon, lat, sd);
  float w = uWarp * chaos;
  float qx = fbm2(p), qy = fbm2(p + vec3(.33, 0., .08));
  float nn = fbm3(cyl(lon + w * qx * .25, lat + w * qy * .09, sd * 1.15 + .19));
  float latW = lat + w * .06 * (qx + nn);
  float brk = mix(clamp(.35 + 2. * qx, 0., 1.), 1., uOrder);  // bands break off along longitude
  float turb = (.25 + .75 * act) * chaos;
  return .5 + .55 * uContrast * bandF(latW) * mix(.3 + .7 * act, 1., .4 * uOrder) * brk + .3 * nn * turb + .08 * qy * chaos;
}

vec3 pal(float v) {
  v = clamp(v, 0., 1.) * 5.;
  float i = min(floor(v), 4.), f = smoothstep(0., 1., v - i);
  vec3 a = uPal[0], b = uPal[1];
  if (i > 3.5) { a = uPal[4]; b = uPal[5]; } else if (i > 2.5) { a = uPal[3]; b = uPal[4]; }
  else if (i > 1.5) { a = uPal[2]; b = uPal[3]; } else if (i > .5) { a = uPal[1]; b = uPal[2]; }
  return mix(a, b, f);
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  float rad = uGeo.z * uZoom;
  vec2 q = (fc - vec2(uGeo.x, uRes.y - uGeo.y)) / rad;
  float r = length(q);
  float hs = hash(fc);
  float dith = (hash(fc + fract(uFrame * .6180339) * 241.) - .5);
  vec3 col = vec3(7., 8., 11.) / 255. + (hs > .9992 ? (30. + 110. * hash(fc.yx)) / 255. * vec3(.9, .95, 1.) : vec3(0.));
  vec2 l2 = normalize(uL.xy + 1e-5);
  if (r >= 1.) {
    // thin halo just outside the disc, brighter on the lit side
    float f = max(0., dot(q / r, l2)) * .85 + .15;
    col += uAcc * exp(-(r - 1.) * 30.) * f * .27;
    o = vec4(col + dith / 255., 1.); return;
  }
  float nz = sqrt(1. - r * r);
  vec3 n = vec3(q, nz);
  // body frame: a little roll and pitch, then latitude/longitude
  const float cr = .98007, sr = .19867, cp = .98723, sp = .15932;
  float xa = q.x * cr + q.y * sr, ya = -q.x * sr + q.y * cr, yb = ya * cp - nz * sp, zb = ya * sp + nz * cp;
  float lat = asin(clamp(yb, -1., 1.)), lon = atan(xa, zb) + uRot;
  float act = smoothstep(-.3, .3, .55 * sin(lat * 2.6 + .9) + .45 * sin(lat * 4.1 - .4) + .1); // 0 = almost calm latitude
  // two advection cycles, offset by half a cycle, cross-fade so the shear never runs away
  float n1 = floor(uTc / HALF), tau1 = uTc - n1 * HALF, w1 = tau1 / HALF, g0, g1;
  float v = (1. - w1) * cloud(lat, lon, tau1 + HALF, n1 - 1., act, g0) + w1 * cloud(lat, lon, tau1, n1, act, g1);
  // ordered state: clean evenly spaced parallels, lined up with the bands
  v += uOrder * (.17 * pow(.5 + .5 * cos(uJets * 3. * lat), 40.) - .05);
  // the eddy: a sunken dark core with a faint pale collar; a smooth oval remains once ordered
  float core = smoothstep(.3, .85, g0), collar = smoothstep(.07, .22, g0) * (1. - smoothstep(.22, .42, g0));
  v = mix(v, .07 + .3 * (v - .5), core * (1. - .6 * uOrder)) + .12 * collar * (1. - uOrder);
  v = mix(v, .32 + .3 * (v - .5), smoothstep(.95, 1.4, abs(lat))); // polar hoods
  // shading: a third of the disc in night; the day/night edge and the limb sharpen as order rises
  float d = dot(n, uL);
  float aa = 1.2 / rad;
  float edge = smoothstep(1., 1. - mix(.015, aa, uOrder), r);
  float sh = (.012 + 1.04 * smoothstep(mix(-.1, -.02, uOrder), mix(.72, .5, uOrder), d)) * edge * (.5 + .5 * pow(nz, .45));
  float haze = pow(1. - nz, 2.5) * .37 * max(0., d + .15);
  float rim = smoothstep(mix(.95, .985, uOrder), .997, r) * .59 * (.22 + .9 * smoothstep(-.35, .45, d)) * edge;
  col = pal(v) * sh + uAcc * (haze + rim);
  col += (hash(fc * 1.37 + fract(uFrame * .7548776) * 173.) - .5) * uGrain;
  // success: the only green is a faint edge on the lit limb
  float limbG = smoothstep(1. - 2. * aa, 1. - aa * .3, r) * max(0., dot(q / r, l2)) * .3;
  col = mix(col, LIME, uGreen * limbG);
  o = vec4(col + dith / 255., 1.);
}`;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });
let U = {}, W = 1, H = 1;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
if (gl) {
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (let i = 0, nu = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS); i < nu; i++) { const nm = gl.getActiveUniform(pr, i).name.replace('[0]', ''); U[nm] = gl.getUniformLocation(pr, nm); }
  // noise volume: 64^3 texels, smooth (quintic) interpolation of a 16^3 random lattice, wraps on every axis
  const S = 64, L = 16, rnd = mulberry32(11), lat = new Float32Array(L * L * L).map(() => rnd()), vol = new Uint8Array(S * S * S);
  const f = x => x * x * x * (x * (x * 6 - 15) + 10);
  for (let z = 0, k = 0; z < S; z++) for (let y = 0; y < S; y++) for (let x = 0; x < S; x++, k++) {
    const gx = x * L / S, gy = y * L / S, gz = z * L / S, x0 = gx | 0, y0 = gy | 0, z0 = gz | 0;
    const u = f(gx - x0), v = f(gy - y0), w = f(gz - z0), x1 = (x0 + 1) % L, y1 = (y0 + 1) % L, z1 = (z0 + 1) % L;
    const at = (a, b, c) => lat[(c * L + b) * L + a];
    const m = (a, b, t) => a + (b - a) * t;
    vol[k] = 255 * m(m(m(at(x0, y0, z0), at(x1, y0, z0), u), m(at(x0, y1, z0), at(x1, y1, z0), u), v),
                     m(m(at(x0, y0, z1), at(x1, y0, z1), u), m(at(x0, y1, z1), at(x1, y1, z1), u), v), w);
  }
  gl.bindTexture(gl.TEXTURE_3D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, S, S, S, 0, gl.RED, gl.UNSIGNED_BYTE, vol);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_3D, p, gl.LINEAR);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, p, gl.REPEAT);
  gl.uniform1i(U.uNoise, 0);
} else console.warn('WebGL 2 unavailable: the planet is not drawn'); // razor: no Canvas 2D fallback

function buildPalette() {
  if (!gl) return;
  gl.uniform3fv(U.uPal, STOPS.flatMap(h => hueRot(hex(h), V.hue)));
  gl.uniform3fv(U.uAcc, hueRot(hex(ACCENT), V.hue));
}
function pushSliders() {
  if (!gl) return;
  gl.uniform1f(U.uJets, V.jets); gl.uniform1f(U.uFlow, V.flow); gl.uniform1f(U.uWarp, V.warp);
  gl.uniform1f(U.uVortex, V.vortex); gl.uniform1f(U.uContrast, V.contrast); gl.uniform1f(U.uGrain, V.grain);
}
let narrow = false;
function resize() {
  W = Math.max(1, Math.round(innerWidth * RES)); H = Math.max(1, Math.round(innerHeight * RES));
  cv.width = W; cv.height = H;
  narrow = innerWidth < 700;
  if (!gl) return;
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform3f(U.uGeo, narrow ? W * 0.62 : W * 0.76, narrow ? H * 0.3 : H * 0.5, narrow ? Math.min(W, H) * 0.62 : Math.min(H * 0.66, W * 0.38));
}

// ---- states: each parameter tweens from wherever it is to the new state's target ----
const tw = {};
for (const k in TARGET.idle) tw[k] = { from: TARGET.idle[k], to: TARGET.idle[k], t0: 0, dur: 1 };
const pv = (k, t) => { const p = tw[k]; return p.from + (p.to - p.from) * ease((t - p.t0) / p.dur); };
// on a phone the sign-in block sits below the planet, so the light swings down-left instead of left
const target = (s, k) => k === 'az' && s !== 'idle' && narrow ? 235 : TARGET[s][k];
let state = 'idle', tCheck = null, lastChange = -99, curT = 0;
const btn = document.querySelector('button.go');
// error is the idle planet plus one line under the button; ?msg= picks the line
const msg = document.getElementById('msg'), MSG = {
  owner: "That Plex account isn't the owner's. Log in with the owner's account.",
  unavailable: "Plex didn't answer. Try again in a moment.",
  expired: 'That log-in attempt expired. Try again.',
  cancelled: 'The Plex window was closed before finishing.',
};
function setState(s, t, instant) {
  for (const k in tw) {
    const p = tw[k], dl = s === 'success' ? DELAY[k] || 0 : 0;
    p.from = instant ? target(s, k) : pv(k, t); p.to = target(s, k); p.t0 = t + (instant ? 0 : dl); p.dur = instant ? 1e-6 : DUR[s][k];
  }
  if (s === 'checking' && tCheck === null) tCheck = t;
  state = s; lastChange = t; document.body.dataset.state = s;
  btn.disabled = s !== 'idle'; btn.setAttribute('aria-busy', s !== 'idle');
  msg.textContent = '';
}

// ---- frame: the CPU only sets a few uniforms ----
let frameNo = 0;
function frame(t) {
  curT = t;
  if (!gl) return;
  const tc = START + t;
  // the eddy quickens while waiting: extra twist accumulates from the moment checking starts
  const twist = tCheck === null ? 0 : 0.12 * Math.min(Math.max(0, t - tCheck), 40);
  const az = pv('az', t) * Math.PI / 180, el = EL * Math.PI / 180;
  gl.uniform3f(U.uL, Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el));
  gl.uniform1f(U.uZoom, pv('zoom', t)); gl.uniform1f(U.uOrder, pv('order', t)); gl.uniform1f(U.uGreen, pv('green', t));
  gl.uniform1f(U.uTwist, twist); gl.uniform1f(U.uTc, tc);
  gl.uniform1f(U.uRot, ((tc / V.spin) % 1) * 2 * Math.PI);
  gl.uniform1f(U.uEddyLon, 3.3 - 0.002 * tc * V.flow);
  gl.uniform1f(U.uFrame, frameNo++);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---- boot ----
buildPalette(); pushSliders(); resize();
{ const s0 = Q.get('state');
  if (s0 === 'checking') setState('checking', 0);
  else if (s0 === 'success') { setState('checking', -4, true); setState('success', 0); }
  else if (s0 === 'error') { document.body.dataset.state = 'error'; msg.textContent = MSG[Q.get('msg')] || MSG.owner; } }

let raf = 0, T0real = 0, tBase = 0, lastDraw = -1e9;
const STEP = 1000 / 24;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const t = tBase + (now - T0real) / 1000;
  // razor: 24 fps fixed step while idle or checking (a 90 s turn and slow drift); full rate through the success transition and 1 s after any state change
  const fast = t - lastChange < (state === 'success' ? 1.7 + DELAY.green + 1 : 1);
  if (!fast) { if (now - lastDraw < STEP) return; lastDraw = now - Math.min((now - lastDraw) % STEP, STEP / 2); }
  else lastDraw = now;
  frame(t);
}
function start() { if (!raf) { T0real = performance.now(); tBase = curT; raf = requestAnimationFrame(loop); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { if (reduced || STILL !== null) return; document.hidden ? stop() : start(); });
addEventListener('resize', () => { resize(); if (reduced || STILL !== null) frame(curT); });

if (BENCH && gl) {
  // runs synchronously at load; readPixels waits for the GPU so each sample covers the whole frame
  const ts = [], px = new Uint8Array(4);
  for (let i = 0; i < 300; i++) { const a = performance.now(); frame(i / 24); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ts.push(performance.now() - a); }
  const s = [...ts].sort((x, y) => x - y), avg = ts.reduce((x, y) => x + y) / ts.length, p99 = s[Math.floor(s.length * 0.99)];
  window.__bench = { state, frames: ts.length, avg, p99, dpr: devicePixelRatio, w: W, h: H };
  const line = `bench ${state} dpr ${devicePixelRatio}: avg ${avg.toFixed(2)} ms, worst 1% ${p99.toFixed(2)} ms`;
  document.title = line; const el = document.getElementById('bench'); el.textContent = line; el.hidden = false;
}
if (STILL !== null) frame(STILL);
else if (reduced) frame(0);
else start();

btn.addEventListener('click', () => {
  if (state !== 'idle') return;
  const go = s => { setState(s, curT, reduced); if (reduced) frame(curT); };
  go('checking'); setTimeout(() => go('success'), 4000);
});

// ---- tweak panel ----
const panel = document.getElementById('panel'), box = document.getElementById('sliders'), vals = document.getElementById('vals');
const showVals = () => { vals.textContent = JSON.stringify(V); };
for (const [k, min, max, step] of SLIDERS) {
  const l = document.createElement('label');
  l.innerHTML = `<span>${k}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${V[k]}"><output>${V[k]}</output>`;
  const inp = l.querySelector('input'), out = l.querySelector('output');
  inp.addEventListener('input', () => {
    V[k] = parseFloat(inp.value); out.textContent = inp.value;
    if (k === 'hue') buildPalette(); else pushSliders();
    if (reduced || STILL !== null) frame(curT);
    showVals();
  });
  box.appendChild(l);
}
showVals();
document.getElementById('ph').addEventListener('click', () => panel.classList.toggle('closed'));
addEventListener('keydown', e => { if ((e.key === 't' || e.key === 'T') && !e.target.closest('input')) panel.classList.toggle('closed'); });
document.getElementById('copy').addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(V)));
