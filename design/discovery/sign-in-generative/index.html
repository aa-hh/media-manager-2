<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in concepts</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #1b1b1b; border-bottom: 1px solid #333; }
  header strong { font-size: 15px; min-width: 260px; }
  .group { display: flex; gap: 4px; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #ddd; color: #111; border-color: #ddd; }
  kbd { font: 12px ui-monospace, monospace; color: #888; margin-left: auto; }
  main { display: grid; place-items: center; background: #000; overflow: auto; }
  iframe { border: 0; background: #000; width: 100%; height: 100%; }
  main.phone iframe { width: 390px; height: 844px; box-shadow: 0 0 0 1px #333; }
</style>
</head>
<body>
<header>
  <div class="group"><button id="prev">←</button><button id="next">→</button></div>
  <strong id="title"></strong>
  <div class="group" id="states">
    <button data-state="idle">Idle</button>
    <button data-state="checking">Checking Plex</button>
    <button data-state="success">Signed in</button>
  </div>
  <div class="group"><button id="phone" aria-pressed="false">Phone</button><button id="reload">Restart</button></div>
  <kbd>← → concepts · 1 2 3 states · P phone · R restart</kbd>
</header>
<main id="main"><iframe id="frame" title="Concept"></iframe></main>
<script>
  const concepts = [
    ["1-noise-field.html", "1 · Noise field with dither"],
    ["2-flow-field.html", "2 · Particles in a flow field"],
    ["3-reaction-diffusion.html", "3 · Reaction-diffusion"],
    ["4-glyph-grid.html", "4 · Glyph grid"],
    ["5-line-fields.html", "5 · Line fields and moiré"],
    ["4a-stream-grid.html", "4a · Glyph grid, download and stream (A)"],
    ["4b-stream-grid.html", "4b · Glyph grid, download and stream (B)"],
    ["2a-planets.html", "2a · Planets (A)"],
    ["2b-planets.html", "2b · Planets (B)"],
    ["4c-grid-playhead.html", "4c · Glyph grid, dialled back (A)"],
    ["4d-grid-arrival.html", "4d · Glyph grid, dialled back (B)"],
    ["2c-jupiter-particles.html", "2c · Jupiter storms, particles"],
    ["2d-jupiter-fluid.html", "2d · Jupiter storms, fluid"],
  ];
  const q = new URLSearchParams(location.search);
  let i = Math.max(0, Math.min(concepts.length - 1, (parseInt(q.get("c")) || 1) - 1));
  let state = q.get("state") || "idle";
  const frame = document.getElementById("frame"), main = document.getElementById("main");
  function show() {
    const [file, name] = concepts[i];
    document.getElementById("title").textContent = name;
    frame.src = file + "?state=" + state;
    for (const b of document.querySelectorAll("#states button")) b.setAttribute("aria-pressed", b.dataset.state === state);
    history.replaceState(null, "", "?c=" + (i + 1) + "&state=" + state);
  }
  document.getElementById("prev").onclick = () => { i = (i + concepts.length - 1) % concepts.length; show(); };
  document.getElementById("next").onclick = () => { i = (i + 1) % concepts.length; show(); };
  document.getElementById("reload").onclick = show;
  document.getElementById("states").onclick = e => { if (e.target.dataset.state) { state = e.target.dataset.state; show(); } };
  document.getElementById("phone").onclick = e => { const on = main.classList.toggle("phone"); e.target.setAttribute("aria-pressed", on); };
  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
    else if (e.key === "ArrowRight") document.getElementById("next").click();
    else if (e.key >= "1" && e.key <= "3") { state = ["idle", "checking", "success"][e.key - 1]; show(); }
    else if (e.key.toLowerCase() === "p") document.getElementById("phone").click();
    else if (e.key.toLowerCase() === "r") show();
  });
  show();
</script>
</body>
</html>
