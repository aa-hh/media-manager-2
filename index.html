<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>media-manager-2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-light-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-light-16.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-dark-16.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/src/client/assets/fonts/SchibstedGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // Light or dark before first paint, so the page never flashes the other one. The choice is Settings' Appearance,
      // kept per device; without one the page follows the system, and keeps following it (src/client/lib/theme.ts).
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          var choice = null;
          try { choice = window.localStorage.getItem('mm2.theme'); } catch (error) {}
          document.documentElement.dataset.theme = choice === 'dark' || (choice !== 'light' && media.matches) ? 'dark' : 'light';
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
