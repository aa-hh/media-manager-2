name: Tests

# The full suite, once per PR and once on every push to main. No path
# filter on purpose: a required check that does not run leaves the PR stuck
# at "expected". The job is named `tests` to match the required check in the
# main ruleset. It runs the same wrapper as the local pre-push hook.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The story tests compare the branch with main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite runs the TV app's unit tests when the branch touches android-tv/.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # The TV app's FFmpeg decoder; on a miss scripts/android-tv.sh installs the NDK and builds it.
      - uses: actions/cache@v4
        with:
          path: android-tv/ffmpeg/out/lib-decoder-ffmpeg-release.aar
          key: ffmpeg-${{ hashFiles('android-tv/ffmpeg/build.sh','android-tv/gradle/libs.versions.toml') }}
      - name: Chromium for the story tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Full suite
        run: sh scripts/test.sh --full
