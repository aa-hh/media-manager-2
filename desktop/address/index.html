<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>media-manager-2</title>
<!-- The web app's sign-in screen (src/client/SignIn.tsx) with its sign-in button swapped for the address field;
     the field, button and error line copy the first-run address step (src/client/FirstRun.tsx). -->
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("SchibstedGrotesk.ttf") format("truetype"); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; overflow: hidden; background: #07080b; font-family: "Schibsted Grotesk", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .scrim { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, #07080b 0%, rgb(7 8 11 / 0) 55%); }
  .block { position: fixed; left: 120px; bottom: 120px; width: 400px; display: flex; flex-direction: column; gap: 24px; }
  h1 { outline: none; font-size: 36px; line-height: 1.15; font-weight: 800; letter-spacing: -0.5px; color: #ece9e1; }
  form { display: flex; flex-direction: column; gap: 24px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #ece9e1; }
  input { height: 40px; width: 100%; border-radius: 12px; border: 1px solid #3a3b40; background: #121317; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #ece9e1; }
  input::placeholder { color: #6f716e; }
  input:focus { outline: none; }
  input:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  button { position: relative; isolation: isolate; align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; color: #07080b; cursor: pointer; transition: color 150ms ease-out; }
  button::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: #9ecae1; transition: inset 150ms ease-out, border-radius 150ms ease-out, background-color 150ms ease-out; }
  button:hover::before { inset: -2px; border-radius: 14px; background: #8bbfdb; }
  button:active::before { background: #76b2d2; transition-duration: 0s; }
  button:focus-visible { outline: 2px solid #111111; outline-offset: 2px; }
  button:hover:focus-visible { outline-offset: 4px; }
  button[aria-busy="true"] { pointer-events: none; }
  button[aria-busy="true"] .label { opacity: 0; }
  .spinner { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; }
  button[aria-busy="true"] .spinner { display: flex; }
  .spinner svg { width: 16px; height: 16px; animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { button::before { transition: none; } }
  .error { font-size: 14px; line-height: 21px; color: #f2a097; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main aria-busy="false">
  <canvas id="planet" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>
  <div class="block">
    <h1 id="heading" tabindex="-1">media-manager-2</h1>
    <form id="form" novalidate>
      <label>
        Server address
        <input id="address" type="url" required autocomplete="url" spellcheck="false" placeholder="https://media.example.com">
      </label>
      <button id="submit" type="submit" aria-busy="false">
        <span class="label">Check address</span>
        <span class="spinner" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
      </button>
      <p id="error" class="error" hidden></p>
    </form>
  </div>
  <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
</main>
<script src="planet.js"></script>
<script>
  const ERRORS = {
    invalid: 'Enter an address like https://media.example.com.',
    no_answer: 'Nothing answered at this address within 10 seconds. Check the address, and that media-manager-2 is running.',
    not_media_manager: 'Something answered at this address, but it isn’t media-manager-2. Check the address.',
  };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const planet = window.createPlanet?.(document.getElementById('planet'), reducedMotion);
  const form = document.getElementById('form');
  const field = document.getElementById('address');
  const button = document.getElementById('submit');
  const errorLine = document.getElementById('error');
  const announcement = document.getElementById('announcement');

  const showError = (code) => {
    errorLine.textContent = ERRORS[code] ?? ERRORS.no_answer;
    errorLine.hidden = false;
    announcement.textContent = errorLine.textContent;
  };
  const busy = (on) => {
    button.setAttribute('aria-busy', String(on));
    document.querySelector('main').setAttribute('aria-busy', String(on));
    planet?.setState(on ? 'checking' : 'idle');
  };

  // Opened again from the menu, or because the saved address stopped answering.
  const query = new URLSearchParams(window.location.search);
  field.value = query.get('address') ?? '';
  if (query.has('error')) showError(query.get('error'));
  requestAnimationFrame(() => (field.value === '' ? field : document.getElementById('heading')).focus());

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (button.getAttribute('aria-busy') === 'true') return;
    errorLine.hidden = true;
    announcement.textContent = 'Checking the address…';
    busy(true);
    let answer;
    try {
      answer = await window.desktopAddress.submit(field.value);
    } catch {
      answer = { error: 'no_answer' };
    }
    if (answer?.ok) return; // the app loads in this window
    busy(false);
    showError(answer?.error);
  });
</script>
</body>
</html>
