<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media-manager-2 — sign in</title>
<style>
  :root {
    --ink: #12140f;
    --bone: #efe3c8;
    --bone-dim: #c9bfa6;
    --rust: #b4482b;
    --plex: #e5a00d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--bone); overflow: hidden; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  main {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: flex-start;
    padding: 12vh 0 0 8vw;
  }
  .plate {
    width: 420px;
    background: var(--ink);
    border: 1px solid #3a3a2c;
    padding: 36px 36px 22px;
  }
  .mark {
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--bone-dim);
    display: flex; align-items: center; gap: 10px;
  }
  .mark i { width: 8px; height: 8px; background: var(--plex); display: inline-block; }
  h1 {
    margin-top: 28px;
    font-size: 34px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em;
  }
  p { margin-top: 14px; font-size: 14px; line-height: 1.55; color: var(--bone-dim); }
  p strong { color: var(--bone); font-weight: 500; }
  button {
    margin-top: 30px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    height: 52px; border: 0; border-radius: 0;
    background: var(--plex); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer;
  }
  button:hover { background: #f0b232; }
  button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
  button svg { width: 14px; height: 14px; }
  .status { margin-top: 14px; min-height: 20px; font-size: 13px; color: var(--bone-dim); }
  body[data-state="checking"] button { background: var(--bone); cursor: progress; }
  body[data-state="refused"] .status { color: #e87a5a; }
  body[data-state="refused"] button { background: var(--bone); }
  @media (max-width: 600px) {
    main { padding: 0 16px 24px; align-items: flex-end; }
    .plate { width: 100%; padding: 28px 22px 24px; }
    h1 { font-size: 28px; margin-top: 20px; }
  }
</style>
</head>
<body data-state="idle">
<canvas id="field" aria-hidden="true"></canvas>
<main>
  <section class="plate" aria-labelledby="title">
    <div class="mark"><i></i>Private instance</div>
    <h1 id="title">media-manager-2</h1>
    <p><strong>Only the owner's Plex account can open this app.</strong></p>
    <p>Plex is used only to confirm who you are. It never sees your password.</p>
    <button type="button" id="signin">
      <svg viewBox="0 0 72 72" aria-hidden="true"><path fill="currentColor" d="M 14.03125 0 L 37.09375 36 L 14.03125 72 L 34.90625 72 L 57.96875 36 L 34.90625 0 L 14.03125 0 z"/></svg>
      <span>Sign in with Plex</span>
    </button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
// ---- Tunable constants ----------------------------------------------------
const SCALE = 2;              // canvas pixels per field pixel; 2 = half resolution, dots show as 2x2 print dots
const PHONE_SCALE = 2;        // same, for narrow screens
const HORIZON = 0.64;         // horizon height as a fraction of the screen (0 = top)
const HORIZON_SWELL = 0.035;  // how far the horizon line bends with slow noise, fraction of height
const SKY_FALLOFF = 0.20;     // how fast the glow fades upward from the horizon, fraction of height
const WATER_FALLOFF = 0.30;   // how fast the reflected glow fades downward
const DRIFT = 0.012;          // noise drift speed, noise units per second (slow on purpose)
const PALETTE_PERIOD = 60;    // seconds for the three middle inks to rotate one full turn
const BAYER_SPREAD = 1.0;     // dither strength; 1 = textbook ordered dither, higher = grainier
const SPECKS = 0.006;         // share of pixels overprinted with an ink or paper speck
const BREATH_PERIOD = 2.6;    // checking: seconds per breath of dither density
const BREATH_DEPTH = 0.13;    // checking: how much the field brightens and darkens per breath
const REFUSE_AT = 0.4;        // refused: seconds after load when the collapse starts
const REFUSE_EASE = 0.7;      // refused: seconds for drift and colour to settle
const SEED = 7;               // seed for the noise lattice and specks

// Inks, darkest to lightest. Ink and paper stay put; the three middle inks rotate.
const INK   = [0x12, 0x14, 0x0f];
const MIDS  = [[0x1f, 0x4a, 0x43],   // verdigris
               [0x8a, 0x34, 0x1e],   // oxblood rust
               [0x4b, 0x3a, 0x6b]];  // dusk violet
const OCHRE = [0xd9, 0xa0, 0x2a];
const PAPER = [0xef, 0xe3, 0xc8];
const REFUSED_INKS = [INK, INK, [0xb4, 0x48, 0x2b], [0xb4, 0x48, 0x2b], [0xb4, 0x48, 0x2b]];

// ---- Setup ------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const state = ['idle', 'checking', 'refused'].includes(params.get('state')) ? params.get('state') : 'idle';
const fixedT = params.has('t') ? parseFloat(params.get('t')) || 0 : null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.body.dataset.state = state;
const statusEl = document.getElementById('status');
if (state === 'checking') {
  document.querySelector('#signin span').textContent = 'Waiting for Plex…';
  statusEl.textContent = 'Finish signing in on the Plex tab.';
}
if (state === 'refused') {
  document.querySelector('#signin span').textContent = 'Try another Plex account';
  statusEl.textContent = "That Plex account doesn't own this app.";
}

// Seeded hash and a 256x256 value-noise lattice.
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED);
const LAT = new Float32Array(256 * 256);
for (let i = 0; i < LAT.length; i++) LAT[i] = rnd();

function vnoise(x, y) {
  const xf = Math.floor(x), yf = Math.floor(y);
  const fx = x - xf, fy = y - yf;
  const xi = xf & 255, yi = yf & 255, xj = (xi + 1) & 255, yj = (yi + 1) & 255;
  const a = LAT[yi * 256 + xi], b = LAT[yi * 256 + xj], c = LAT[yj * 256 + xi], d = LAT[yj * 256 + xj];
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm3(x, y) { return 0.55 * vnoise(x, y) + 0.3 * vnoise(x * 2.03 + 17.1, y * 2.03 + 3.7) + 0.15 * vnoise(x * 4.1 + 41.3, y * 4.1 + 9.2); }

const BAYER8 = (() => {
  const m = [[0, 2], [3, 1]]; let b = m;
  for (let s = 2; s < 8; s *= 2) {
    const n = [];
    for (let y = 0; y < s * 2; y++) { n.push([]); for (let x = 0; x < s * 2; x++) n[y].push(4 * b[y % s][x % s] + m[(y / s) | 0][(x / s) | 0]); }
    b = n;
  }
  return Float32Array.from(b.flat().map(v => (v + 0.5) / 64));
})();

const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, img, buf, specks;
function resize() {
  const s = innerWidth < 600 ? PHONE_SCALE : SCALE;
  W = Math.ceil(innerWidth / s); H = Math.ceil(innerHeight / s);
  canvas.width = W; canvas.height = H;
  img = ctx.createImageData(W, H);
  buf = new Uint32Array(img.data.buffer);
  const r = mulberry(SEED * 31);
  specks = new Int8Array(W * H);
  for (let i = 0; i < specks.length; i++) { const h = r(); specks[i] = h < SPECKS ? -1 : h > 1 - SPECKS ? 1 : 0; }
}

const RUST = (255 << 24) | (0x2b << 16) | (0x48 << 8) | 0xb4;
const pack = c => (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
const mix = (a, b, k) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * k));

function inksAt(t, collapse) {
  const p = ((t / PALETTE_PERIOD) % 1) * 3, k0 = Math.floor(p), f = p - k0;
  const ease = f * f * (3 - 2 * f);
  const mids = [0, 1, 2].map(i => mix(MIDS[(i + k0) % 3], MIDS[(i + k0 + 1) % 3], ease));
  // Ordered dark to light: ink, mid A, mid B, ochre, paper. Mid C tints the water.
  const full = [INK, mids[0], mids[1], OCHRE, PAPER];
  return { inks: full.map((c, i) => pack(mix(c, REFUSED_INKS[i], collapse))), water: mix(mids[2], REFUSED_INKS[1], collapse) };
}

// ---- One frame ----------------------------------------------------------------
function draw(t) {
  let drift = t, collapse = 0, bias = 0;
  if (state === 'refused' && t > REFUSE_AT) {
    const k = 1 - Math.exp(-(t - REFUSE_AT) / REFUSE_EASE);
    drift = REFUSE_AT + REFUSE_EASE * k;  // drift decelerates to a stop
    collapse = Math.min(1, k * 1.15);
  }
  if (state === 'checking') bias = BREATH_DEPTH * Math.sin(2 * Math.PI * t / BREATH_PERIOD);

  const { inks, water } = inksAt(drift, collapse);
  const waterInk = pack(water);
  const D = drift * DRIFT;
  const aspect = W / H;
  const spread = BAYER_SPREAD * (1 + (state === 'checking' ? 0.6 * Math.sin(2 * Math.PI * t / BREATH_PERIOD + 1.2) : 0));
  const narrow = innerWidth < 600;
  const hBase = narrow ? 0.42 : HORIZON;

  // Precompute the horizon line per column.
  const hz = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const u = x / H;
    hz[x] = (hBase + HORIZON_SWELL * (fbm3(u * 1.4 + D * 6, 5.5 + D * 2) - 0.5) * 2) * H;
  }

  let i = 0;
  for (let y = 0; y < H; y++) {
    const brow = (y & 7) * 8;
    for (let x = 0; x < W; x++, i++) {
      const d = (y - hz[x]) / H;  // signed distance to the horizon, in screen heights
      let L, waterPx = false;
      if (d < 0) {
        // Sky: cloud bands stretched sideways, lit by distance to the horizon.
        const nx = x / H * 2.2, ny = y / H * 6.0;
        const warp = vnoise(nx * 0.5 + D * 3, ny * 0.3 - D);
        const n = fbm3(nx + warp * 1.6 - D * 9, ny + warp * 0.8);
        const glow = Math.exp(d / SKY_FALLOFF);
        L = glow * (0.55 + 0.75 * n) + 0.22 * n * n - 0.06 - 0.25 * Math.max(0, -d - 0.25);
        if (-d < 0.012) L += 0.35 * (1 + d / 0.012);  // thin bright seam on the horizon
      } else {
        // Water: a ground plane in perspective; ripples squeeze toward the horizon.
        const z = 0.05 / (d + 0.004);
        const wx = (x / H - aspect * 0.5) * z * 2.2, wz = z * 9;
        const n = fbm3(wx * 2.5 + D * 2, wz - D * 24);
        const glow = Math.exp(-d / WATER_FALLOFF);
        L = glow * glow * (0.25 + 0.95 * n) + 0.14 * n - 0.06 - 0.3 * d;
        waterPx = true;
      }
      L += bias;
      const th = 0.5 + (BAYER8[brow + (x & 7)] - 0.5) * spread;
      let q, c;
      if (collapse > 0.5) {
        // Refused: one-bit dither, ink or rust only.
        q = L * 1.3 + th - 0.75 > 0.5 ? 4 : 0;
        c = q ? RUST : inks[0];
      } else {
        q = Math.floor(L * 4 + th);
        q = q < 0 ? 0 : q > 4 ? 4 : q;
        c = waterPx && q === 2 ? waterInk : inks[q];
      }
      const s = specks[i];
      if (s === -1) c = inks[0]; else if (s === 1 && q >= 2 && collapse <= 0.5) c = inks[4];
      buf[i] = c;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---- Loop --------------------------------------------------------------------------
resize();
if (fixedT !== null) {
  draw(fixedT);
} else if (reduce) {
  draw(state === 'refused' ? 6 : 8);
} else {
  addEventListener('resize', resize);
  const t0 = performance.now();
  let frames = 0, acc = 0;
  const loop = now => {
    const a = performance.now();
    draw((now - t0) / 1000);
    acc += performance.now() - a; frames++;
    if (frames === 120) { window.__frameMs = acc / frames; frames = 0; acc = 0; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
