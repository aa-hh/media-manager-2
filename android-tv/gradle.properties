org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Task outputs are reused across worktrees and branches (scripts/android-tv.sh puts Gradle's home on the Space drive).
org.gradle.caching=true
# Idle daemons give their memory back after 30 minutes instead of 3 hours.
org.gradle.daemon.idletimeout=1800000
# Without this the Kotlin daemon copies Gradle's 4 GB heap.
kotlin.daemon.jvmargs=-Xmx2g
